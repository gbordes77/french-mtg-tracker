name: Scrape Pro Tour standings

on:
  # Cron toutes les 30 min — désactivé par défaut, à activer pendant un PT actif
  schedule:
    - cron: "*/30 * * * *"

  # Déclenchement manuel via gh workflow run scrape.yml
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug de l'événement (ex: pt-secrets-of-strixhaven)"
        required: true
        default: "pt-secrets-of-strixhaven"
      round:
        description: "Ronde précise (vide = auto)"
        required: false

permissions:
  contents: write  # nécessaire pour push automatique

env:
  # Force les actions JS sur Node 24 (Node 20 déprécié, retiré le 2026-06-02).
  # À retirer quand actions/checkout et actions/setup-python publieront des
  # versions natives Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scrapers/requirements.txt"

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Determine active events
        id: events
        env:
          # Inputs passés via env quoted pour éviter toute injection shell.
          SLUG_INPUT: ${{ inputs.slug }}
        run: |
          # Lit public/data/events.json et ne garde que les events status=live
          python3 -c "
          import json, os
          events = json.load(open('public/data/events.json'))
          live = [e['slug'] for e in events if e['status'] == 'live']
          slug_input = os.environ.get('SLUG_INPUT', '').strip()
          if slug_input:
              live = [slug_input]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'slugs={\" \".join(live)}\n')
          print(f'Events à scraper: {live}')
          "

      - name: Scrape each active event
        if: steps.events.outputs.slugs != ''
        env:
          # Inputs interpolés dans le shell uniquement via variables env quotées.
          # La validation finale du slug se fait côté Python (SLUG_REGEX).
          ROUND_INPUT: ${{ inputs.round }}
          SLUGS: ${{ steps.events.outputs.slugs }}
        run: |
          set -e
          fail_count=0
          ok_count=0
          for slug in $SLUGS; do
            echo "▶ Scraping $slug"
            if [ -n "$ROUND_INPUT" ]; then
              if python scrapers/scrape_event.py --slug "$slug" --round "$ROUND_INPUT"; then
                ok_count=$((ok_count + 1))
              else
                echo "⚠ Failed: $slug R$ROUND_INPUT"
                fail_count=$((fail_count + 1))
              fi
            else
              if python scrapers/scrape_event.py --slug "$slug" --auto; then
                ok_count=$((ok_count + 1))
              else
                echo "⚠ Failed: $slug --auto"
                fail_count=$((fail_count + 1))
              fi
            fi
          done
          echo "Résultat scrape: $ok_count OK, $fail_count fails"
          # Si TOUS les events ont échoué, on signale au workflow
          if [ "$ok_count" -eq 0 ] && [ "$fail_count" -gt 0 ]; then
            echo "::error::Tous les events ont échoué ($fail_count/$fail_count)"
            exit 1
          fi

      - name: Commit & push if changes
        run: |
          git config user.name "frenchmtg-bot"
          git config user.email "bot@frenchmtg.app"
          git add public/data/
          if git diff --quiet --staged; then
            echo "✓ Aucun changement à commiter"
          else
            git commit -m "chore: refresh standings $(date -u +%FT%TZ)"
            git push
            echo "✓ Push effectué"
          fi
