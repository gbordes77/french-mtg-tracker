<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E68AB" />

    <!-- SEO -->
    <title>French MTG Tracker — Les Français au Pro Tour</title>
    <meta name="description" content="Suivi en temps réel des performances des joueurs français aux Pro Tours, World Championship et événements compétitifs Magic: The Gathering." />

    <!-- Open Graph -->
    <meta property="og:title" content="French MTG Tracker" />
    <meta property="og:description" content="Les Français au Pro Tour, en direct." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://french-mtg-tracker.vercel.app" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MTGTools_FR" />

    <!--
      Polices ManaTuner (canon brandbook §3) :
      - Cinzel    → display headings (H1-H4)
      - Inter     → body, H5/H6
      - JetBrains Mono → techTerm captions, data tabulaire

      Weights réduits aux usages réels du code : Cinzel 500/700, Inter
      400/500/600/700, JetBrains 400/500. -60kb transferred vs avant.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Mana Font (https://mana.andrewgioia.com) — symboles WUBRG canoniques.
      Chargé en async pour ne pas bloquer le LCP (les symboles peuvent
      flasher 50ms après le first paint sans nuire à l'UX).
    -->
    <link
      rel="preload"
      as="style"
      href="https://cdn.jsdelivr.net/npm/mana-font@1.18.0/css/mana.min.css"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/mana-font@1.18.0/css/mana.min.css"
      />
    </noscript>

    <!--
      Pré-applique le thème (light|dark) depuis localStorage AVANT le first paint
      pour éviter un flash de thème au mount React. Le toggle dans Header.tsx
      lit/écrit la même clé `frmtg-theme`.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("frmtg-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.dataset.theme = saved;
          }
        } catch (e) { /* localStorage indispo (private browsing) → garde l'attribut HTML */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
